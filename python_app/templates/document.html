<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <script>
    MathJax = {
      tex: { inlineMath: [['\\(','\\)'], ['$','$']], displayMath: [['\\[','\\]'], ['$$','$$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','code'] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    :root {
      --color-bg: #ffffff;
      --color-text: #1a1a2e;
      --color-text-secondary: #4a4a6a;
      --color-heading: #16213e;
      --color-link: #0f4c75;
      --color-link-hover: #3282b8;
      --color-border: #e0e0e0;
      --color-code-bg: #f5f5f7;
      --color-blockquote-bg: #f8f9fa;
      --color-blockquote-border: #3282b8;
      --color-toc-bg: #fafbfc;
      --color-toc-active: #0f4c75;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-heading: "Georgia", "Times New Roman", serif;
      --font-mono: "SF Mono", "Fira Code", "Fira Mono", Menlo, Consolas, monospace;
      --max-width: 780px;
      --sidebar-width: 260px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #1a1a2e;
        --color-text: #e0e0e0;
        --color-text-secondary: #a0a0b0;
        --color-heading: #bbe1fa;
        --color-link: #3282b8;
        --color-link-hover: #bbe1fa;
        --color-border: #2a2a4a;
        --color-code-bg: #16213e;
        --color-blockquote-bg: #16213e;
        --color-blockquote-border: #3282b8;
        --color-toc-bg: #16213e;
        --color-toc-active: #bbe1fa;
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .document-wrapper {
      display: flex;
      min-height: 100vh;
    }

    /* Table of Contents Sidebar */
    .toc-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      overflow-y: auto;
      padding: 2rem 1rem;
      background-color: var(--color-toc-bg);
      border-right: 1px solid var(--color-border);
      font-size: 0.85rem;
    }

    .toc-title {
      font-family: var(--font-heading);
      font-size: 1rem;
      color: var(--color-heading);
      margin: 0 0 1rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--color-border);
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-item {
      margin: 0.25rem 0;
    }

    .toc-item a {
      display: block;
      padding: 0.3rem 0.5rem;
      color: var(--color-text-secondary);
      text-decoration: none;
      border-radius: 4px;
      transition: color 0.2s, background-color 0.2s;
    }

    .toc-item a:hover,
    .toc-item a:focus {
      color: var(--color-toc-active);
      background-color: var(--color-border);
      outline: none;
    }

    .toc-empty {
      color: var(--color-text-secondary);
      font-style: italic;
    }

    /* Main Content */
    .content {
      flex: 1;
      min-width: 0;
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 3rem;
    }

    .document-header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 3px solid var(--color-border);
    }

    .document-title {
      font-family: var(--font-heading);
      font-size: 2.25rem;
      color: var(--color-heading);
      margin: 0;
      line-height: 1.3;
    }

    .document-meta {
      margin-top: 0.75rem;
      font-size: 0.9rem;
      color: var(--color-text-secondary);
    }

    /* Typography */
    .document-body h1,
    .document-body h2,
    .document-body h3,
    .document-body h4,
    .document-body h5,
    .document-body h6 {
      font-family: var(--font-heading);
      color: var(--color-heading);
      margin-top: 2em;
      margin-bottom: 0.75em;
      line-height: 1.3;
    }

    .document-body h1 { font-size: 1.875rem; }
    .document-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
    .document-body h3 { font-size: 1.25rem; }
    .document-body h4 { font-size: 1.1rem; }

    .document-body p {
      margin: 0 0 1.25em;
    }

    .document-body a {
      color: var(--color-link);
      text-decoration: underline;
      text-underline-offset: 2px;
      transition: color 0.2s;
    }

    .document-body a:hover,
    .document-body a:focus {
      color: var(--color-link-hover);
    }

    /* Lists */
    .document-body ul,
    .document-body ol {
      margin: 0 0 1.25em;
      padding-left: 1.5em;
    }

    .document-body li {
      margin-bottom: 0.4em;
    }

    .document-body li > ul,
    .document-body li > ol {
      margin-top: 0.4em;
      margin-bottom: 0;
    }

    /* Code */
    .document-body code {
      font-family: var(--font-mono);
      font-size: 0.875em;
      background-color: var(--color-code-bg);
      padding: 0.15em 0.4em;
      border-radius: 3px;
    }

    .document-body pre {
      background-color: var(--color-code-bg);
      padding: 1.25rem;
      border-radius: 6px;
      overflow-x: auto;
      margin: 0 0 1.5em;
      border: 1px solid var(--color-border);
    }

    .document-body pre code {
      background: none;
      padding: 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    /* Blockquotes */
    .document-body blockquote {
      margin: 0 0 1.5em;
      padding: 1rem 1.5rem;
      background-color: var(--color-blockquote-bg);
      border-left: 4px solid var(--color-blockquote-border);
      border-radius: 0 4px 4px 0;
      color: var(--color-text-secondary);
    }

    .document-body blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Tables */
    .document-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 1.5em;
      font-size: 0.9rem;
    }

    .document-body th,
    .document-body td {
      padding: 0.75rem 1rem;
      text-align: left;
      border: 1px solid var(--color-border);
    }

    .document-body th {
      background-color: var(--color-code-bg);
      font-weight: 600;
      color: var(--color-heading);
    }

    .document-body tr:nth-child(even) {
      background-color: var(--color-blockquote-bg);
    }

    /* Images */
    .document-body img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 1em 0;
      border: 1px solid var(--color-border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    /* Textbook-style floating figures */
    .document-body .figure-wrap {
      margin: 0.75em 0 0.75em 1.5em;
      float: right;
      clear: right;
      max-width: 45%;
      padding: 0;
    }

    .document-body .figure-wrap:nth-of-type(even) {
      float: left;
      margin: 0.75em 1.5em 0.75em 0;
      clear: left;
    }

    .document-body .figure-wrap img {
      width: 100%;
      max-width: 100%;
      margin: 0;
      display: block;
    }

    .document-body .figure-wrap figcaption {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: 0.4em;
      font-style: italic;
      line-height: 1.4;
    }

    /* Full-width images for very large/important diagrams */
    .document-body .figure-full {
      clear: both;
      margin: 2em 0;
      text-align: center;
    }

    .document-body .figure-full img {
      max-width: 90%;
      margin: 0 auto;
      display: block;
    }

    .document-body .figure-full figcaption {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      text-align: center;
      margin-top: 0.5em;
      font-style: italic;
    }

    /* Clearfix for sections after floated images */
    .document-body h1,
    .document-body h2,
    .document-body h3 {
      clear: both;
    }

    .document-body::after {
      content: "";
      display: table;
      clear: both;
    }

    /* Horizontal Rule */
    .document-body hr {
      border: none;
      border-top: 2px solid var(--color-border);
      margin: 2.5em 0;
    }

    /* Back to Top Button */
    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--color-border);
      background-color: var(--color-bg);
      color: var(--color-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s, background-color 0.2s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }

    .back-to-top:hover,
    .back-to-top:focus {
      background-color: var(--color-code-bg);
      outline: 2px solid var(--color-link);
      outline-offset: 2px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .document-wrapper {
        flex-direction: column;
      }

      .toc-sidebar {
        position: relative;
        height: auto;
        width: 100%;
        min-width: unset;
        border-right: none;
        border-bottom: 1px solid var(--color-border);
        padding: 1.5rem;
      }

      .content {
        padding: 2rem 1.5rem;
      }

      .document-title {
        font-size: 1.75rem;
      }
    }

    @media (max-width: 600px) {
      .content {
        padding: 1.5rem 1rem;
      }

      .document-title {
        font-size: 1.5rem;
      }

      .document-body pre {
        padding: 0.75rem;
        font-size: 0.8rem;
      }

      .toc-sidebar {
        padding: 1rem;
      }

      /* Unfloat images on small screens */
      .document-body .figure-wrap {
        float: none;
        max-width: 100%;
        margin: 1em 0;
        clear: both;
      }

      .document-body .figure-wrap:nth-of-type(even) {
        float: none;
        margin: 1em 0;
      }
    }

    /* Print */
    @media print {
      .toc-sidebar,
      .back-to-top,
      .edit-toolbar {
        display: none;
      }

      .document-wrapper {
        display: block;
      }

      .content {
        max-width: 100%;
        padding: 0;
      }

      .document-body a {
        color: inherit;
        text-decoration: underline;
      }

      .document-body a::after {
        content: " (" attr(href) ")";
        font-size: 0.8em;
        color: #666;
      }

      .document-body pre {
        white-space: pre-wrap;
        border: 1px solid #ccc;
      }

      .document-body img {
        max-width: 100%;
        page-break-inside: avoid;
      }
    }

    /* Editor Toolbar */
    .edit-toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--color-bg);
      border-bottom: 2px solid var(--color-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      transform: translateY(-100%);
      transition: transform 0.3s ease;
    }

    .edit-toolbar.visible {
      transform: translateY(0);
    }

    .edit-toolbar .toolbar-group {
      display: flex;
      gap: 0.25rem;
      padding-right: 0.75rem;
      border-right: 1px solid var(--color-border);
      margin-right: 0.5rem;
    }

    .edit-toolbar .toolbar-group:last-child {
      border-right: none;
      margin-left: auto;
    }

    .edit-toolbar button {
      padding: 0.4rem 0.6rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-bg);
      color: var(--color-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
      min-width: 32px;
      text-align: center;
    }

    .edit-toolbar button:hover {
      background: var(--color-code-bg);
      border-color: var(--color-link);
    }

    .edit-toolbar button.active {
      background: var(--color-link);
      color: #fff;
      border-color: var(--color-link);
    }

    .edit-toolbar .btn-save {
      background: #10b981;
      color: #fff;
      border-color: #10b981;
      padding: 0.4rem 1rem;
    }

    .edit-toolbar .btn-save:hover {
      background: #059669;
    }

    .edit-toolbar .btn-cancel {
      background: var(--color-bg);
      color: var(--color-text);
    }

    .edit-toggle {
      position: fixed;
      top: 1rem;
      right: 5rem;
      z-index: 999;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      transition: background 0.2s, border-color 0.2s;
    }

    .edit-toggle:hover {
      border-color: var(--color-link);
      background: var(--color-code-bg);
    }

    .document-body[contenteditable="true"] {
      outline: 2px dashed var(--color-link);
      outline-offset: 8px;
      min-height: 200px;
    }

    .document-body[contenteditable="true"]:focus {
      outline-color: var(--color-link-hover);
    }

    .save-status {
      font-size: 0.8rem;
      color: var(--color-text-secondary);
      padding: 0.25rem 0.5rem;
    }

    .save-status.success {
      color: #10b981;
    }

    .save-status.error {
      color: #ef4444;
    }

    /* Modal Overlays */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-dialog {
      background: var(--color-bg);
      border-radius: 12px;
      padding: 1.5rem;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .modal-dialog h3 {
      margin: 0 0 1rem;
      font-size: 1.1rem;
      color: var(--color-heading);
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }

    /* Formula Dialog */
    .formula-tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 0.5rem;
    }

    .formula-tab {
      padding: 0.4rem 0.8rem;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      border-radius: 4px;
    }

    .formula-tab.active {
      background: var(--color-code-bg);
      color: var(--color-text);
      font-weight: 500;
    }

    .formula-panel.hidden {
      display: none;
    }

    .formula-panel label {
      display: block;
      font-size: 0.85rem;
      color: var(--color-text-secondary);
      margin-bottom: 0.4rem;
    }

    .formula-panel textarea {
      width: 100%;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      padding: 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-code-bg);
      color: var(--color-text);
      resize: vertical;
    }

    .formula-panel textarea:focus {
      outline: 2px solid var(--color-link);
      border-color: transparent;
    }

    .formula-options {
      display: flex;
      gap: 1.5rem;
      margin: 0.75rem 0;
      font-size: 0.85rem;
    }

    .formula-options label {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
    }

    .formula-preview {
      min-height: 40px;
      padding: 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-bg);
      font-size: 1.1rem;
      text-align: center;
      margin-top: 0.5rem;
    }

    .formula-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.4rem;
    }

    .formula-tpl {
      padding: 0.6rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-bg);
      cursor: pointer;
      font-size: 1.1rem;
      text-align: center;
      transition: background 0.15s;
    }

    .formula-tpl:hover {
      background: var(--color-code-bg);
      border-color: var(--color-link);
    }

    /* Symbol Grid */
    .symbol-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 0.3rem;
      max-height: 300px;
      overflow-y: auto;
    }

    .symbol-btn {
      padding: 0.5rem;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      background: var(--color-bg);
      cursor: pointer;
      font-size: 1.2rem;
      text-align: center;
      transition: background 0.15s;
    }

    .symbol-btn:hover {
      background: var(--color-code-bg);
      border-color: var(--color-link);
    }
  </style>
</head>
<body>
  <div class="document-wrapper">
    <aside class="toc-sidebar" aria-label="Table of contents">
      <nav>
        <h2 class="toc-title">Contents</h2>
        {% if toc %}
        <ul class="toc-list">
          {% for entry in toc %}
          <li class="toc-item toc-level-{{ entry.level }}" style="padding-left:{{ (entry.level - 1) * 12 }}px">
            <a href="#{{ entry.id }}">{{ entry.text }}</a>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="toc-empty">No headings found</p>
        {% endif %}
      </nav>
    </aside>
    <main class="content" role="main">
      <header class="document-header">
        <h1 class="document-title">{{ title }}</h1>
        <div class="document-meta">
          {{ page_count }} pages
          {% if image_count %} &middot; {{ image_count }} images{% endif %}
        </div>
      </header>
      <article class="document-body">
        {{ body_html | safe }}
      </article>
    </main>
  </div>

  <button class="back-to-top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M10 16V4M4 10l6-6 6 6"/>
    </svg>
  </button>

  <button class="edit-toggle" id="editToggle" aria-label="Toggle edit mode">Edit</button>

  <div class="edit-toolbar" id="editToolbar" role="toolbar" aria-label="Formatting toolbar">
    <div class="toolbar-group">
      <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
      <button type="button" data-cmd="strikethrough" title="Strikethrough"><s>S</s></button>
      <button type="button" data-cmd="subscript" title="Subscript">X<sub>2</sub></button>
      <button type="button" data-cmd="superscript" title="Superscript">X<sup>2</sup></button>
    </div>
    <div class="toolbar-group">
      <button type="button" data-cmd="formatBlock" data-val="h1" title="Heading 1">H1</button>
      <button type="button" data-cmd="formatBlock" data-val="h2" title="Heading 2">H2</button>
      <button type="button" data-cmd="formatBlock" data-val="h3" title="Heading 3">H3</button>
      <button type="button" data-cmd="formatBlock" data-val="p" title="Paragraph">P</button>
      <button type="button" data-cmd="formatBlock" data-val="blockquote" title="Blockquote">&#8220;</button>
    </div>
    <div class="toolbar-group">
      <button type="button" data-cmd="insertUnorderedList" title="Bullet list">&#8226; List</button>
      <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
    </div>
    <div class="toolbar-group">
      <button type="button" id="btnFormula" title="Insert LaTeX formula">&#8721; Formula</button>
      <button type="button" id="btnSymbol" title="Insert symbol">&#937; Symbol</button>
    </div>
    <div class="toolbar-group">
      <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)">Redo</button>
    </div>
    <div class="toolbar-group">
      <span class="save-status" id="saveStatus"></span>
      <button type="button" class="btn-cancel" id="editCancel">Cancel</button>
      <button type="button" class="btn-save" id="editSave">Save</button>
    </div>
  </div>

  <!-- Formula Input Dialog -->
  <div class="modal-overlay" id="formulaModal">
    <div class="modal-dialog">
      <h3>Insert LaTeX Formula</h3>
      <div class="formula-tabs">
        <button type="button" class="formula-tab active" data-tab="custom">Custom</button>
        <button type="button" class="formula-tab" data-tab="templates">Templates</button>
      </div>
      <div class="formula-panel" id="formulaCustom">
        <label for="formulaInput">LaTeX expression:</label>
        <textarea id="formulaInput" rows="3" placeholder="e.g. E = mc^2 or \frac{-b \pm \sqrt{b^2-4ac}}{2a}"></textarea>
        <div class="formula-options">
          <label><input type="radio" name="formulaType" value="inline" checked /> Inline \( ... \)</label>
          <label><input type="radio" name="formulaType" value="display" /> Display \[ ... \]</label>
        </div>
        <div class="formula-preview" id="formulaPreview"></div>
      </div>
      <div class="formula-panel hidden" id="formulaTemplates">
        <div class="formula-grid">
          <button type="button" class="formula-tpl" data-latex="\\frac{a}{b}" title="Fraction">&#x00B9;&#8260;&#x2082;</button>
          <button type="button" class="formula-tpl" data-latex="\\sqrt{x}" title="Square root">&#8730;x</button>
          <button type="button" class="formula-tpl" data-latex="\\sum_{i=1}^{n}" title="Summation">&#8721;</button>
          <button type="button" class="formula-tpl" data-latex="\\int_{a}^{b}" title="Integral">&#8747;</button>
          <button type="button" class="formula-tpl" data-latex="\\lim_{x \\to \\infty}" title="Limit">lim</button>
          <button type="button" class="formula-tpl" data-latex="\\vec{v}" title="Vector">v&#8407;</button>
          <button type="button" class="formula-tpl" data-latex="\\alpha" title="Alpha">&#945;</button>
          <button type="button" class="formula-tpl" data-latex="\\beta" title="Beta">&#946;</button>
          <button type="button" class="formula-tpl" data-latex="\\gamma" title="Gamma">&#947;</button>
          <button type="button" class="formula-tpl" data-latex="\\theta" title="Theta">&#952;</button>
          <button type="button" class="formula-tpl" data-latex="\\pi" title="Pi">&#960;</button>
          <button type="button" class="formula-tpl" data-latex="\\infty" title="Infinity">&#8734;</button>
          <button type="button" class="formula-tpl" data-latex="\\neq" title="Not equal">&#8800;</button>
          <button type="button" class="formula-tpl" data-latex="\\leq" title="Less or equal">&#8804;</button>
          <button type="button" class="formula-tpl" data-latex="\\geq" title="Greater or equal">&#8805;</button>
          <button type="button" class="formula-tpl" data-latex="\\pm" title="Plus minus">&#177;</button>
          <button type="button" class="formula-tpl" data-latex="\\times" title="Times">&#215;</button>
          <button type="button" class="formula-tpl" data-latex="\\div" title="Division">&#247;</button>
          <button type="button" class="formula-tpl" data-latex="\\rightarrow" title="Right arrow">&#8594;</button>
          <button type="button" class="formula-tpl" data-latex="\\Rightarrow" title="Implies">&#8658;</button>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="formulaCancel">Cancel</button>
        <button type="button" class="btn-save" id="formulaInsert">Insert</button>
      </div>
    </div>
  </div>

  <!-- Symbol Picker Dialog -->
  <div class="modal-overlay" id="symbolModal">
    <div class="modal-dialog">
      <h3>Insert Symbol</h3>
      <div class="symbol-grid" id="symbolGrid"></div>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="symbolCancel">Close</button>
      </div>
    </div>
  </div>

  <script>
    // Back to top visibility
    (function() {
      var btn = document.querySelector('.back-to-top');
      if (!btn) return;
      window.addEventListener('scroll', function() {
        if (window.scrollY > 300) {
          btn.classList.add('visible');
        } else {
          btn.classList.remove('visible');
        }
      }, { passive: true });
    })();

    // Active TOC highlighting
    (function() {
      var tocLinks = document.querySelectorAll('.toc-item a');
      if (tocLinks.length === 0) return;

      var headings = [];
      tocLinks.forEach(function(link) {
        var id = link.getAttribute('href');
        if (id && id.startsWith('#')) {
          var el = document.getElementById(id.substring(1));
          if (el) headings.push({ el: el, link: link });
        }
      });

      function updateActive() {
        var scrollPos = window.scrollY + 100;
        var active = null;

        for (var i = headings.length - 1; i >= 0; i--) {
          if (headings[i].el.offsetTop <= scrollPos) {
            active = headings[i];
            break;
          }
        }

        tocLinks.forEach(function(link) {
          link.style.color = '';
          link.style.fontWeight = '';
        });

        if (active) {
          active.link.style.color = 'var(--color-toc-active)';
          active.link.style.fontWeight = '600';
        }
      }

      window.addEventListener('scroll', updateActive, { passive: true });
      updateActive();
    })();

    // Inline Editor
    (function() {
      var editToggle = document.getElementById('editToggle');
      var editToolbar = document.getElementById('editToolbar');
      var editSave = document.getElementById('editSave');
      var editCancel = document.getElementById('editCancel');
      var saveStatus = document.getElementById('saveStatus');
      var docBody = document.querySelector('.document-body');
      var originalContent = '';
      var isEditing = false;

      if (!editToggle || !docBody) return;

      editToggle.addEventListener('click', function() {
        if (!isEditing) {
          enterEditMode();
        } else {
          exitEditMode(false);
        }
      });

      editCancel.addEventListener('click', function() {
        exitEditMode(true);
      });

      editSave.addEventListener('click', saveContent);

      // Toolbar formatting commands
      editToolbar.addEventListener('click', function(e) {
        var btn = e.target.closest('button[data-cmd]');
        if (!btn) return;
        e.preventDefault();
        var cmd = btn.getAttribute('data-cmd');
        var val = btn.getAttribute('data-val') || null;
        document.execCommand(cmd, false, val);
        docBody.focus();
      });

      function enterEditMode() {
        isEditing = true;
        originalContent = docBody.innerHTML;
        docBody.setAttribute('contenteditable', 'true');
        docBody.focus();
        editToolbar.classList.add('visible');
        editToggle.textContent = 'Editing...';
        editToggle.style.borderColor = 'var(--color-link)';
        saveStatus.textContent = '';
        // Push content down to avoid toolbar overlap
        document.querySelector('.document-wrapper').style.marginTop = '52px';
      }

      function exitEditMode(revert) {
        isEditing = false;
        if (revert) {
          docBody.innerHTML = originalContent;
        }
        docBody.removeAttribute('contenteditable');
        editToolbar.classList.remove('visible');
        editToggle.textContent = 'Edit';
        editToggle.style.borderColor = '';
        document.querySelector('.document-wrapper').style.marginTop = '';
      }

      function saveContent() {
        saveStatus.textContent = 'Saving...';
        saveStatus.className = 'save-status';

        var htmlContent = docBody.innerHTML;

        fetch(window.location.pathname, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body_html: htmlContent })
        })
        .then(function(res) {
          if (res.ok) {
            saveStatus.textContent = 'Saved';
            saveStatus.className = 'save-status success';
            originalContent = htmlContent;
            refreshTOC();
            setTimeout(function() { exitEditMode(false); }, 1000);
          } else {
            return res.json().then(function(data) {
              throw new Error(data.error || 'Save failed');
            });
          }
        })
        .catch(function(err) {
          saveStatus.textContent = err.message;
          saveStatus.className = 'save-status error';
        });
      }

      function refreshTOC() {
        var tocList = document.querySelector('.toc-list');
        if (!tocList) return;

        // Rebuild TOC from current headings in the document body
        var headings = docBody.querySelectorAll('h1, h2, h3');
        var items = [];

        headings.forEach(function(h) {
          var level = parseInt(h.tagName.charAt(1), 10);
          var text = h.textContent.trim();
          if (!text) return;

          // Ensure heading has an ID for linking
          if (!h.id) {
            h.id = text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
          }

          var indent = (level - 1) * 12;
          items.push(
            '<li class="toc-item toc-level-' + level + '" style="padding-left:' + indent + 'px">' +
            '<a href="#' + h.id + '">' + text + '</a></li>'
          );
        });

        if (items.length > 0) {
          tocList.innerHTML = items.join('');
        } else {
          tocList.innerHTML = '<p class="toc-empty">No headings found</p>';
        }
      }

      // Keyboard shortcuts while editing
      docBody.addEventListener('keydown', function(e) {
        if (!isEditing) return;
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
          e.preventDefault();
          saveContent();
        }
      });

      // --- Formula Modal ---
      var formulaModal = document.getElementById('formulaModal');
      var formulaInput = document.getElementById('formulaInput');
      var formulaPreview = document.getElementById('formulaPreview');
      var formulaInsert = document.getElementById('formulaInsert');
      var formulaCancel = document.getElementById('formulaCancel');
      var formulaTabs = document.querySelectorAll('.formula-tab');
      var formulaCustom = document.getElementById('formulaCustom');
      var formulaTemplates = document.getElementById('formulaTemplates');

      document.getElementById('btnFormula').addEventListener('click', function() {
        formulaModal.classList.add('visible');
        formulaInput.value = '';
        formulaPreview.innerHTML = '';
        formulaInput.focus();
      });

      formulaCancel.addEventListener('click', function() {
        formulaModal.classList.remove('visible');
      });

      // Tab switching
      formulaTabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
          formulaTabs.forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          var target = tab.getAttribute('data-tab');
          formulaCustom.classList.toggle('hidden', target !== 'custom');
          formulaTemplates.classList.toggle('hidden', target !== 'templates');
        });
      });

      // Template buttons insert into input
      document.querySelectorAll('.formula-tpl').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var latex = btn.getAttribute('data-latex');
          formulaInput.value += latex;
          formulaInput.focus();
          updateFormulaPreview();
          // Switch to custom tab to show input
          formulaTabs.forEach(function(t) { t.classList.remove('active'); });
          formulaTabs[0].classList.add('active');
          formulaCustom.classList.remove('hidden');
          formulaTemplates.classList.add('hidden');
        });
      });

      // Live preview
      formulaInput.addEventListener('input', updateFormulaPreview);

      function updateFormulaPreview() {
        var latex = formulaInput.value.trim();
        if (!latex) {
          formulaPreview.innerHTML = '<em style="color:var(--color-text-secondary)">Preview appears here</em>';
          return;
        }
        formulaPreview.innerHTML = '\\[' + latex + '\\]';
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise([formulaPreview]);
        }
      }

      formulaInsert.addEventListener('click', function() {
        var latex = formulaInput.value.trim();
        if (!latex) return;

        var type = document.querySelector('input[name="formulaType"]:checked').value;
        var wrapped = type === 'inline' ? '\\(' + latex + '\\)' : '\\[' + latex + '\\]';

        // Insert at cursor position in the editable area
        docBody.focus();
        var span = document.createElement('span');
        span.innerHTML = wrapped;
        var sel = window.getSelection();
        if (sel.rangeCount) {
          var range = sel.getRangeAt(0);
          range.deleteContents();
          range.insertNode(span);
          range.setStartAfter(span);
          range.collapse(true);
          sel.removeAllRanges();
          sel.addRange(range);
        } else {
          docBody.appendChild(span);
        }

        // Re-render MathJax
        if (window.MathJax && MathJax.typesetPromise) {
          MathJax.typesetPromise([docBody]);
        }

        formulaModal.classList.remove('visible');
      });

      // --- Symbol Modal ---
      var symbolModal = document.getElementById('symbolModal');
      var symbolGrid = document.getElementById('symbolGrid');
      var symbolCancel = document.getElementById('symbolCancel');

      var symbols = [
        '\u00B1','\u00D7','\u00F7','\u2260','\u2248','\u2264','\u2265','\u221E',
        '\u2211','\u220F','\u222B','\u2202','\u2207','\u221A','\u00B2','\u00B3',
        '\u03B1','\u03B2','\u03B3','\u03B4','\u03B5','\u03B6','\u03B7','\u03B8',
        '\u03BB','\u03BC','\u03C0','\u03C3','\u03C4','\u03C6','\u03C8','\u03C9',
        '\u0394','\u03A3','\u03A9','\u03A6','\u2192','\u2190','\u2191','\u2193',
        '\u21D2','\u21D4','\u2200','\u2203','\u2208','\u2209','\u2282','\u2283',
        '\u222A','\u2229','\u2205','\u00AC','\u2227','\u2228','\u22A5','\u2234',
        '\u00B0','\u2103','\u212B','\u00B5','\u2126','\u0127','\u210F','\u2113'
      ];

      // Build symbol grid
      symbols.forEach(function(sym) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'symbol-btn';
        btn.textContent = sym;
        btn.title = 'Insert ' + sym;
        btn.addEventListener('click', function() {
          docBody.focus();
          document.execCommand('insertText', false, sym);
          symbolModal.classList.remove('visible');
        });
        symbolGrid.appendChild(btn);
      });

      document.getElementById('btnSymbol').addEventListener('click', function() {
        symbolModal.classList.add('visible');
      });

      symbolCancel.addEventListener('click', function() {
        symbolModal.classList.remove('visible');
      });

      // Close modals on backdrop click
      [formulaModal, symbolModal].forEach(function(modal) {
        modal.addEventListener('click', function(e) {
          if (e.target === modal) modal.classList.remove('visible');
        });
      });
    })();
  </script>
</body>
</html>
