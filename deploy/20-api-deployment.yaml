apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf2html-api
  namespace: pdf2html
  labels: { app: pdf2html-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: pdf2html-api }
  template:
    metadata:
      labels: { app: pdf2html-api }
    spec:
      # Workload Identity: pods authenticate to OCI (Object Storage, Queue) via
      # instance/workload principals — no keys mounted.
      serviceAccountName: pdf2html-workload
      nodeSelector: { pool: api-pool }
      containers:
        - name: api
          image: <region>.ocir.io/<tenancy-namespace>/pdf2html/api:<git-sha>
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef: { name: pdf2html-config }
            - secretRef: { name: pdf2html-secrets }
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /readyz, port: 8501 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8501 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pdf2html-api
  namespace: pdf2html
  labels: { app: pdf2html-api }
spec:
  selector: { app: pdf2html-api }
  ports:
    - name: http
      port: 80
      targetPort: 8501
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pdf2html-api
  namespace: pdf2html
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pdf2html-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
